<!-- header.component.html -->
<nav class="navbar navbar-default navbar-expand-lg navbar-dark fixed-top" id="mainNav">
  <div class="container">
    <!-- Logo / Brand -->
    <a class="navbar-brand"  (click)="scrollToSection($event, 'home')">Delas Studio</a>

    <!-- Botão mobile (hambúrguer) - Bootstrap 5 -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
      aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Menu colapsável -->
    <div class="collapse navbar-collapse" id="navbarContent">
      <ul class="navbar-nav ms-auto">
        <!-- Home (leva ao topo) -->
        <li class="nav-item">
          <a class="nav-link" [class.active]="activeSection === 'home'"
             (click)="scrollToSection($event, 'home')">Home</a>
        </li>

        <!-- Serviços -->
        <li class="nav-item">
          <a class="nav-link" [class.active]="activeSection === 'servicos'"
             (click)="scrollToSection($event, 'servicos')">Serviços</a>
        </li>

        <!-- Portfólio -->
        <li class="nav-item">
          <a class="nav-link" [class.active]="activeSection === 'portfolio'"
             (click)="scrollToSection($event, 'portfolio')">Portfólio</a>
        </li>

        <!-- Contato -->
        <li class="nav-item">
          <a class="nav-link" [class.active]="activeSection === 'contato'"
             (click)="scrollToSection($event, 'contato')">Contato</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
